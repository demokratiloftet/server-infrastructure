# Operator-approved topology. Installed under /etc/loftet-deploy/apps/app-protospace/.
# Tailscale Serve forwards HTTPS on the host's tailnet address to loopback:3210.
services:
  app:
    image: loftet-deploy/app-protospace:bootstrap
    init: true
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports: ["127.0.0.1:3210:3000"]
    networks: [sandbox]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
networks:
  sandbox:
    internal: true
    enable_ipv6: false
