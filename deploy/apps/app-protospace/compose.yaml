{
  "services":
    {
      "app":
        {
          "init": true,
          "restart": "unless-stopped",
          "user": "1000:1000",
          "read_only": true,
          "cap_drop": ["ALL"],
          "security_opt": ["no-new-privileges:true"],
          "mem_limit": "256m",
          "cpus": 0.5,
          "pids_limit": 100,
          "logging":
            {
              "driver": "json-file",
              "options": { "max-size": "5m", "max-file": "2" },
            },
          "image": "loftet-deploy/app-protospace:unconfigured",
          "networks": ["sandbox"],
          "environment":
            {
              "HOST": "0.0.0.0",
              "PORT": "3000",
              "APP_ORIGIN": "https://app-protospace.hackaton.demokratiloftet.no",
              "PDS_URL": "http://gateway:3001",
              "PDS_PUBLIC_URL": "https://pds.hackaton.demokratiloftet.no",
            },
          "tmpfs": ["/tmp:rw,noexec,nosuid,nodev,size=16m"],
          "healthcheck":
            {
              "test":
                [
                  "CMD",
                  "node",
                  "-e",
                  "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
                ],
              "interval": "10s",
              "timeout": "3s",
              "retries": 3,
              "start_period": "10s",
            },
        },
      "gateway":
        {
          "init": true,
          "restart": "unless-stopped",
          "user": "1000:1000",
          "read_only": true,
          "cap_drop": ["ALL"],
          "security_opt": ["no-new-privileges:true"],
          "mem_limit": "64m",
          "cpus": 0.25,
          "pids_limit": 100,
          "logging":
            {
              "driver": "json-file",
              "options": { "max-size": "5m", "max-file": "2" },
            },
          "image": "node:24.22.1-bookworm-slim@sha256:55fb5f5a527ea2c5c4a95f963e48ef90aa38c7b346054fdc8ee9957a2b55d205",
          "command": ["node", "/gateway.mjs"],
          "volumes": ["./gateway.mjs:/gateway.mjs:ro"],
          "ports": ["127.0.0.1:3210:3000"],
          "networks": ["sandbox", "ingress", "services"],
          "labels":
            {
              "traefik.enable": "true",
              "traefik.docker.network": "server-infrastructure_tailnet-egress",
              "traefik.http.routers.sandbox-app-protospace.rule": "Host(`app-protospace.hackaton.demokratiloftet.no`) || Host(`app-protospace.dev.demokratiloftet.no`) || Host(`hackaton.demokratiloftet.no`)",
              "traefik.http.routers.sandbox-app-protospace.entrypoints": "websecure",
              "traefik.http.routers.sandbox-app-protospace.tls.certresolver": "letsencrypt",
              "traefik.http.routers.sandbox-app-protospace.tls.domains[0].main": "hackaton.demokratiloftet.no",
              "traefik.http.routers.sandbox-app-protospace.tls.domains[0].sans": "*.hackaton.demokratiloftet.no",
              "traefik.http.routers.sandbox-app-protospace.service": "sandbox-app-protospace",
              "traefik.http.services.sandbox-app-protospace.loadbalancer.server.port": "3000",
            },
          "depends_on": { "app": { "condition": "service_healthy" } },
          "healthcheck":
            {
              "test":
                [
                  "CMD",
                  "node",
                  "-e",
                  "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
                ],
              "interval": "10s",
              "timeout": "3s",
              "retries": 3,
              "start_period": "10s",
            },
          "environment": { "PDS_PROXY": "true" },
        },
    },
  "networks":
    {
      "sandbox": { "internal": true, "enable_ipv6": false },
      "ingress":
        { "external": true, "name": "server-infrastructure_tailnet-egress" },
      "services": { "external": true, "name": "hackathon-services" },
    },
}
