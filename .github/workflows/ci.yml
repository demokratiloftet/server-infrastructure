name: CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
      - name: Scan Git history for secrets
        run: bash .github/scripts/scan-secrets.sh
      - run: python3 deploy/test_receive.py
      - run: python3 deploy/test_sandbox.py
      - run: python3 deploy/test_public_hackathon.py
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm audit --audit-level=moderate
      - run: npm test
      - run: npm ci --ignore-scripts --prefix public-demo/calendar
      - run: npm audit --audit-level=moderate --prefix public-demo/calendar
      - run: npm test --prefix public-demo/calendar
      - name: Validate private Compose topology
        run: |
          python3 public-demo/test/configure.py
          python3 public-demo/preflight.py --staging
          python3 spaces-demo/configure.py --staging
          python3 spaces-demo/verify.py --staging --config-only
      - name: Verify original PDS patch and non-root image
        run: |
          docker build -t loftet-pds:ci -f public-demo/Dockerfile.pds .
          test "$(docker image inspect loftet-pds:ci --format '{{.Config.User}}')" = node
      - name: Run isolated Spaces acceptance
        run: |
          python3 spaces-demo/test/configure.py
          sh spaces-demo/test/compose.sh build
          sh spaces-demo/test/compose.sh up -d --wait
          node dist/spaces-demo/test/smoke.js
          sh spaces-demo/test/compose.sh exec -T spaces-app node dist/test/native.js
          python3 spaces-demo/verify.py --test
      - name: Stop test containers
        if: always()
        run: |
          if test -f spaces-demo/test/.runtime/test.env; then
            sh spaces-demo/test/compose.sh down
          fi
